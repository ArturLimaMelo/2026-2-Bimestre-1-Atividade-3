services:
  tcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpp
    image: exemplo_cpp
    command: ["/app/tcp_server"]
    ports:
      - "9090:9090"

  tcp-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpp
    image: exemplo_cpp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - bash
      - -lc
      - |
        until bash -lc 'echo > /dev/tcp/host.docker.internal/9090' >/dev/null 2>&1; do
          sleep 0.2
        done
        exec /app/tcp_client
    depends_on:
      - tcp-server